<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>The Best App</h1>
      <button type="button" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <button type="button" id="clear-completed">Clear completed</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
