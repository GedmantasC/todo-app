<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Best App</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Kept inline on purpose: a module script would run too late.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>The Best App</h1>
        <button type="button" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      </header>

      <form id="todo-form">
        <label for="todo-input" class="visually-hidden">New task</label>
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task..."
          autocomplete="off"
          maxlength="200"
        />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" aria-live="polite"></ul>

      <footer class="app-footer">
        <span id="todo-count"></span>
        <nav class="filters" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
      </footer>

      <button type="button" id="clear-completed">Clear completed</button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
