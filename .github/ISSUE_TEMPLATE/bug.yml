name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Add a task "…"
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
